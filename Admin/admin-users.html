!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة تحكم المدير - جوكر</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }
    header {
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
    }
    .container {
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }
    .admin-actions {
      text-align: left;
      margin-bottom: 20px;
    }
    .admin-actions button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 15px;
      text-align: center;
      border: 1px solid #ddd;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    .btn-edit {
      background-color: #ffc107;
      color: #000;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-delete {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <i class="fas fa-tools"></i> لوحة تحكم المدير - جوكر
</header>

<div class="container">
  <div class="admin-actions">
    <button onclick="alert('فتح نموذج إضافة مستخدم')"><i class="fas fa-user-plus"></i> إضافة مستخدم جديد</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>المعرف</th>
        <th>الاسم</th>
        <th>البريد</th>
        <th>الدور</th>
        <th>الحالة</th>
        <th>الخيارات</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>#1</td>
        <td>محمد علي</td>
        <td>mohamed@example.com</td>
        <td>مدير</td>
        <td>نشط</td>
        <td>
          <button class="btn-edit">تعديل</button>
          <button class="btn-delete">حذف</button>
        </td>
      </tr>
      <tr>
        <td>#2</td>
        <td>ليلى</td>
        <td>layla@example.com</td>
        <td>مستخدم</td>
        <td>محظور</td>
        <td>
          <button class="btn-edit">تعديل</button>
          <button class="btn-delete">حذف</button>
        </td>
      </tr>
      <!-- مزيد من المستخدمين -->
    </tbody>
  </table>
</div>

</body>
</html>
